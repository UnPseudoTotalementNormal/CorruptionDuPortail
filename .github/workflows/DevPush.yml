name: DevPush

on:
  push:
    branches:
      - Dev

jobs:
  notif-push-direct:
    runs-on: ubuntu-latest
    steps:
      - name: Discord — Push direct
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMPARE_URL: ${{ github.event.compare }}
        run: |
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg actor "$ACTOR" \
              --arg msg "$COMMIT_MSG" \
              --arg url "$COMPARE_URL" \
              '{embeds:[{title:"⚠️ Push direct sur Dev — Corruption du Portail",color:16776960,fields:[{name:"Auteur",value:$actor,inline:true},{name:"Message",value:$msg,inline:false}],url:$url}]}')"
