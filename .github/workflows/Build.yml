name: Build

on:
  push:
    branches:
      - Main

# Two Windows builds of the same commit, sent together to Discord:
# - Relay: UGS login + UGS lobbies + Unity Relay. Several copies run on one PC (tests).
# - Steam: Steam profile + Steam lobbies + Steam Datagram Relay. Needs Steam running, one copy per Steam account.
# The flavor is a compile define added by CdpBuild (Assets/Scripts/Editor/Build/CdpBuild.cs), never ProjectSettings.

jobs:
  announce:
    name: Annonce Discord
    runs-on: ubuntu-latest
    outputs:
      start: ${{ steps.timer.outputs.start }}
    steps:
      - name: Enregistrer heure de départ
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Discord — Démarrage
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg actor "$ACTOR" \
              --arg msg "$COMMIT_MSG" \
              --arg url "$RUN_URL" \
              '{embeds:[{title:"🔨 Builds démarrées (Relay + Steam) — Corruption du Portail",color:15105570,fields:[{name:"Auteur",value:$actor,inline:true},{name:"Commit",value:$msg,inline:false}],url:$url}]}')"

  build:
    name: Build Unity (StandaloneWindows64, ${{ matrix.flavor }})
    needs: announce
    runs-on: ubuntu-latest
    # A failed flavor must not mark the whole run failed: the other build is posted, and the next changelog starts
    # from this run (prev_build keeps successful runs only). The notify job fails the run when nothing was built.
    continue-on-error: true
    strategy:
      # One flavor failing must not cancel the other: testers still get the build that worked.
      fail-fast: false
      matrix:
        include:
          - flavor: relay
            artifact: Build-Windows-Relay
            buildName: CorruptionDuPortail_b${{ github.run_number }}
          - flavor: steam
            artifact: Build-Windows-Steam
            buildName: CorruptionDuPortail_Steam_b${{ github.run_number }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Libérer espace disque
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Espace disque avant build
        run: df -h

      # Both flavors share the Library: the define only changes the player scripts, compiled during the build.
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: 6000.5.0f1
          buildName: ${{ matrix.buildName }}
          buildMethod: CdpBuild.BuildFromCommandLine
          # -cdpLogs on: playtest builds stream their logs online (CdpBuild). A public build must pass -cdpLogs off.
          customParameters: -cdpFlavor ${{ matrix.flavor }} -cdpLogs on

      - name: Vérifier la build Steam
        if: matrix.flavor == 'steam'
        run: |
          OUT=build/StandaloneWindows64
          ls -la "$OUT"
          test -f "$OUT/steam_appid.txt" || { echo "steam_appid.txt manquant"; exit 1; }
          find "$OUT" -iname 'steam_api64.dll' | grep -q . || { echo "steam_api64.dll manquant : la build Steam ne pourra pas démarrer Steam"; exit 1; }

      - name: Espace disque après build
        run: df -h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build

  notify:
    name: Changelog + Discord
    needs: [announce, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A matrix job only reports one result for all its legs: the artifacts tell which flavor actually built.
      - name: Lister les builds produites
        id: artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });
            const link = name => {
              const a = data.artifacts.find(x => x.name === name);
              return a ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${a.id}` : '';
            };
            const relay = link('Build-Windows-Relay');
            const steam = link('Build-Windows-Steam');
            core.setOutput('relay', relay);
            core.setOutput('steam', steam);
            core.setOutput('any', relay || steam ? 'true' : 'false');

      - name: Supprimer anciens artifacts (garder 5 par build)
        if: steps.artifacts.outputs.any == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['Build-Windows-Relay', 'Build-Windows-Steam', 'Build-StandaloneWindows64']) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                per_page: 100
              });
              const sorted = data.artifacts.sort((a, b) =>
                new Date(b.created_at) - new Date(a.created_at));
              for (const a of sorted.slice(5)) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: a.id
                });
                console.log(`Deleted: ${name} ${a.id} — ${a.created_at}`);
              }
            }

      - name: Récupérer SHA build précédente
        id: prev_build
        if: steps.artifacts.outputs.any == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // No `status: 'success'` filter: that index lags, it skipped the
            // previous build and sent the changelog back to a months-old commit.
            // List recent runs and keep the newest successful one before this run.
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'Build.yml',
              branch: 'Main',
              per_page: 30
            });
            const prev = runs.data.workflow_runs
              .filter(r => r.id !== context.runId && r.conclusion === 'success' && r.run_number < context.runNumber)
              .sort((a, b) => b.run_number - a.run_number)[0];
            console.log(prev ? `Previous build: run ${prev.id} @ ${prev.head_sha}` : 'No previous build');
            core.setOutput('sha', prev ? prev.head_sha : '');

      - name: Préparer commits pour changelog
        id: commits
        if: steps.artifacts.outputs.any == 'true'
        env:
          PREV_SHA: ${{ steps.prev_build.outputs.sha }}
        run: |
          if [ -z "$PREV_SHA" ]; then
            echo "status=first" >> $GITHUB_OUTPUT
            exit 0
          fi
          COMMITS=$(git log "$PREV_SHA".."$GITHUB_SHA" --pretty=format:"### %s%n%b%n" --no-merges 2>/dev/null || echo "")
          if [ -z "$COMMITS" ]; then
            echo "status=empty" >> $GITHUB_OUTPUT
            exit 0
          fi
          printf '%s' "$COMMITS" > "$RUNNER_TEMP/commits.txt"
          # Writing guidelines shared by every generator below (Claude, Codex, Gemini).
          cp .github/changelog-prompt.md "$RUNNER_TEMP/changelog_prompt.md"
          echo "status=ok" >> $GITHUB_OUTPUT

      # Primary generator: Claude Code CLI headless (subscription OAuth token, no paid API).
      # The claude-code-action GitHub Action cannot run on a `push` event
      # ("Unsupported event type: push"), so we drive the CLI directly instead.
      - name: Générer changelog (Claude Opus, CLI headless)
        if: steps.commits.outputs.status == 'ok'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude --version || echo "claude CLI install failed"
          cd "$RUNNER_TEMP"
          claude -p "Lis changelog_prompt.md : ce sont tes consignes de rédaction. Les commits sont dans commits.txt. Rédige le changelog en suivant ces consignes et écris-le, et rien d'autre, dans le fichier changelog.txt." \
            --model claude-opus-5-5 \
            --allowedTools Read,Write \
            --permission-mode acceptEdits 2>&1 | tail -5

      # 1st fallback: OpenAI Codex CLI headless (ChatGPT subscription auth,
      # no paid API). Auth = the local `~/.codex/auth.json` (from `codex login`)
      # stored as the CODEX_AUTH_JSON secret and restored on the runner.
      # `codex exec --full-auto` runs non-interactively with workspace-write, and
      # `--cd $RUNNER_TEMP` lets it read commits.txt and write changelog.txt there.
      # Skipped when Claude already produced a changelog.
      - name: Générer changelog (Codex, fallback CLI headless)
        if: steps.commits.outputs.status == 'ok'
        continue-on-error: true
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -n "$(cat "$RUNNER_TEMP/changelog.txt" 2>/dev/null | tr -d '[:space:]')" ]; then
            echo "Changelog déjà généré par Claude — skip Codex."
            exit 0
          fi
          npm install -g @openai/codex >/dev/null 2>&1
          codex --version || echo "codex CLI install failed"
          mkdir -p "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          codex exec --full-auto --skip-git-repo-check --cd "$RUNNER_TEMP" \
            "Lis changelog_prompt.md : ce sont tes consignes de rédaction. Les commits sont dans commits.txt. Rédige le changelog en suivant ces consignes et écris-le, et rien d'autre, dans le fichier changelog.txt." 2>&1 | tail -20 || true

      - name: Lire changelog (fallback Gemini)
        id: changelog
        if: always() && steps.artifacts.outputs.any == 'true'
        env:
          STATUS: ${{ steps.commits.outputs.status }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "$STATUS" = "first" ]; then
            echo "text=Première build — pas de changelog." >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$STATUS" = "empty" ]; then
            echo "text=Améliorations internes." >> $GITHUB_OUTPUT
            exit 0
          fi
          TEXT=$(cat "$RUNNER_TEMP/changelog.txt" 2>/dev/null || echo "")
          if [ -z "$(printf '%s' "$TEXT" | tr -d '[:space:]')" ]; then
            echo "Claude + Codex indisponibles — fallback Gemini."
            COMMITS=$(cat "$RUNNER_TEMP/commits.txt" 2>/dev/null || echo "")
            jq -n --arg commits "$COMMITS" --rawfile guide "$RUNNER_TEMP/changelog_prompt.md" \
              '{contents:[{parts:[{text:($guide+"\n\n# Commits\n\n"+$commits)}]}]}' \
              > "$RUNNER_TEMP/changelog_payload.json"
            RESPONSE=$(curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d @"$RUNNER_TEMP/changelog_payload.json")
            echo "Gemini raw response: $RESPONSE"
            TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "Changelog indisponible."')
          fi
          echo "text<<EOF" >> $GITHUB_OUTPUT
          echo "$TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Calculer durée
        id: duration
        if: always()
        env:
          START_TIME: ${{ needs.announce.outputs.start }}
        run: |
          DIFF=$(( $(date +%s) - ${START_TIME:-$(date +%s)} ))
          echo "value=$(printf '%dm%02ds' $((DIFF/60)) $((DIFF%60)))" >> $GITHUB_OUTPUT

      # always(): a failed changelog step must never swallow the build announcement.
      - name: Discord — Builds prêtes
        if: always() && steps.artifacts.outputs.any == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK }}
          BUILD_NUMBER: b${{ github.run_number }}
          DURATION: ${{ steps.duration.outputs.value }}
          CHANGELOG: ${{ steps.changelog.outputs.text }}
          RELAY_URL: ${{ steps.artifacts.outputs.relay }}
          STEAM_URL: ${{ steps.artifacts.outputs.steam }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          link() { if [ -n "$1" ]; then printf '[Télécharger](%s)\n%s' "$1" "$2"; else printf '❌ Build échouée, [voir les logs](%s)' "$RUN_URL"; fi; }
          RELAY=$(link "$RELAY_URL" "Connexion Unity Relay. Plusieurs copies sur le même PC pour tester.")
          STEAM=$(link "$STEAM_URL" "Connexion par Steam (Steam doit être lancé). Une copie par compte Steam.")
          if [ -n "$RELAY_URL" ] && [ -n "$STEAM_URL" ]; then
            TITLE="✅ Builds réussies — Corruption du Portail"; COLOR=5763719
          else
            TITLE="⚠️ Une build sur deux réussie — Corruption du Portail"; COLOR=16776960
          fi
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --argjson color "$COLOR" \
              --arg name "$BUILD_NUMBER" \
              --arg dur "$DURATION" \
              --arg log "$CHANGELOG" \
              --arg relay "$RELAY" \
              --arg steam "$STEAM" \
              --arg url "$RUN_URL" \
              '{embeds:[{title:$title,color:$color,description:($log | if length > 4000 then .[0:3990] + "\n…" else . end),fields:[{name:"Build",value:$name,inline:true},{name:"Durée",value:$dur,inline:true},{name:"🖥️ Build Relay (tests)",value:$relay,inline:false},{name:"🎮 Build Steam",value:$steam,inline:false}],url:$url}]}')"

      - name: Discord — Échec
        if: always() && steps.artifacts.outputs.any != 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          DURATION: ${{ steps.duration.outputs.value }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg dur "$DURATION" \
              --arg url "$RUN_URL" \
              '{embeds:[{title:"❌ Builds échouées — Corruption du Portail",color:15548997,fields:[{name:"Durée",value:$dur,inline:true},{name:"Logs",value:("[Voir logs]("+$url+")"),inline:false}],url:$url}]}')"

      - name: Échouer le run si aucune build
        if: always() && steps.artifacts.outputs.any != 'true'
        run: exit 1
