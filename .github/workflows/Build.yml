name: Build

on:
  push:
    branches:
      - Main

jobs:
  build:
    name: Build Unity (StandaloneWindows64)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Enregistrer heure de départ
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Discord — Démarrage
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg actor "$ACTOR" \
              --arg msg "$COMMIT_MSG" \
              --arg url "$RUN_URL" \
              '{embeds:[{title:"🔨 Build démarrée — Corruption du Portail",color:15105570,fields:[{name:"Auteur",value:$actor,inline:true},{name:"Commit",value:$msg,inline:false}],url:$url}]}')"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Libérer espace disque
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Espace disque avant build
        run: df -h

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: 6000.2.6f2
          buildName: CorruptionDuPortail_b${{ github.run_number }}

      - name: Espace disque après build
        run: df -h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-StandaloneWindows64
          path: build

      - name: Supprimer anciens artifacts (garder 5)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Build-StandaloneWindows64',
              per_page: 100
            });
            const sorted = data.artifacts.sort((a, b) =>
              new Date(b.created_at) - new Date(a.created_at));
            for (const a of sorted.slice(5)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id
              });
              console.log(`Deleted: ${a.id} — ${a.created_at}`);
            }

      - name: Récupérer SHA build précédente
        id: prev_build
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'Build.yml',
              branch: 'main',
              status: 'success',
              per_page: 10
            });
            const prev = runs.data.workflow_runs.find(r => r.id !== context.runId);
            core.setOutput('sha', prev ? prev.head_sha : '');

      - name: Générer changelog (Gemini Flash)
        id: changelog
        if: success()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PREV_SHA: ${{ steps.prev_build.outputs.sha }}
        run: |
          if [ -z "$PREV_SHA" ]; then
            echo "text=Première build — pas de changelog." >> $GITHUB_OUTPUT
            exit 0
          fi
          COMMITS=$(git log "$PREV_SHA".."$GITHUB_SHA" --oneline --no-merges 2>/dev/null || echo "")
          if [ -z "$COMMITS" ]; then
            echo "text=Améliorations internes." >> $GITHUB_OUTPUT
            exit 0
          fi
          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg commits "$COMMITS" \
              '{contents:[{parts:[{text:("Commits Unity entre deux builds :\n"+$commits+"\n\nGénère un changelog court en français pour des joueurs (max 400 caractères). Bullet points •. Groupé par Nouveautés/Corrections si pertinent. Ignore les commits ci/chore/test/refactor. Si aucun commit pertinent, réponds uniquement : Améliorations internes.")}]}]}')")
          TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "Changelog indisponible."')
          echo "text<<EOF" >> $GITHUB_OUTPUT
          echo "$TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Calculer durée
        id: duration
        if: always()
        env:
          START_TIME: ${{ steps.timer.outputs.start }}
        run: |
          DIFF=$(( $(date +%s) - $START_TIME ))
          echo "value=$(printf '%dm%02ds' $((DIFF/60)) $((DIFF%60)))" >> $GITHUB_OUTPUT

      - name: Discord — Succès
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK }}
          BUILD_NAME: CorruptionDuPortail_b${{ github.run_number }}
          DURATION: ${{ steps.duration.outputs.value }}
          CHANGELOG: ${{ steps.changelog.outputs.text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg name "$BUILD_NAME" \
              --arg dur "$DURATION" \
              --arg log "$CHANGELOG" \
              --arg url "$RUN_URL" \
              '{embeds:[{title:"✅ Build réussie — Corruption du Portail",color:5763719,fields:[{name:"Build",value:$name,inline:true},{name:"Durée",value:$dur,inline:true},{name:"Changelog",value:$log,inline:false},{name:"Artifact",value:("[Télécharger]("+$url+")"),inline:false}],url:$url}]}')"

      - name: Discord — Échec
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          DURATION: ${{ steps.duration.outputs.value }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg dur "$DURATION" \
              --arg url "$RUN_URL" \
              '{embeds:[{title:"❌ Build échouée — Corruption du Portail",color:15548997,fields:[{name:"Durée",value:$dur,inline:true},{name:"Logs",value:("[Voir logs]("+$url+")"),inline:false}],url:$url}]}')"
