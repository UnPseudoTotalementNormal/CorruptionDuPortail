name: DevMergeNotif

# Runs on Poyo's PC now (tools/build/local_ci.py, same message): GitHub Actions was blocked by a billing lock
# (2026-11-07). Kept by hand only, so a lifted lock never posts twice.
on:
  workflow_dispatch:

jobs:
  notif-pr-mergee:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Discord — PR mergée
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGER: ${{ github.event.pull_request.merged_by.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg author "$AUTHOR" \
              --arg merger "$MERGER" \
              --arg title "$PR_TITLE" \
              --arg url "$PR_URL" \
              '{embeds:[{title:("✅ PR mergée — "+$title),color:5763719,fields:[{name:"Créée par",value:$author,inline:true},{name:"Acceptée par",value:$merger,inline:true}],url:$url}]}')"
