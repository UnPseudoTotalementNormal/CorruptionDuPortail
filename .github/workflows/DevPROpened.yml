name: DevPROpened

on:
  pull_request:
    types: [opened]
    branches:
      - Dev

jobs:
  notif-pr-ouverte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discord — PR ouverte
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          LIST=$(git log "$BASE_SHA".."$HEAD_SHA" --no-merges --pretty=format:'%s (%h)' \
            | sed 's/^/- /')
          COUNT=$(printf '%s' "$LIST" | grep -c '^-' || true)
          if [ -z "$LIST" ]; then LIST="Aucun commit"; COUNT=0; fi
          LIST=$(printf '%s' "$LIST" | head -c 1000)
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg author "$AUTHOR" \
              --arg title "$PR_TITLE" \
              --arg url "$PR_URL" \
              --arg list "$LIST" \
              --arg count "$COUNT" \
              '{embeds:[{title:("📥 Nouvelle PR — "+$title),color:3447003,fields:[{name:"Auteur",value:$author,inline:true},{name:("Commits ("+$count+")"),value:$list,inline:false}],url:$url}]}')"
